[project]
name = "xiaoman-wechat"
dynamic = ["version"]
description = "住在微信群里、像一个真人群友的 AI：小满"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = { attr = "aigroup.__version__" }

[tool.setuptools.packages.find]
include = ["aigroup*"]

[tool.setuptools.package-data]
aigroup = ["web/*.html", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "napcat", ".venv", "home"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E402", "E731", "B008", "B904", "B905", "E741", "B023", "B007"]
