# 23.3 问题回归集：日报里确认过的每一件事存一条（名字换成通用的）。
# 每次改发前检查 / 提示词前后都要过：tests/group/test_incidents.py（不调大模型，只看规则检查）；
# scripts/release_gate.py --llm 会再拿统一自检（check_critic）跑一遍，看它能认出几条。
#
# 字段：
#   id / date / what：哪天、出了什么事（日报里的编号）
#   mode：checks.FAILURE_MODES 里第几条（从 1 数）
#   msgs：之前的聊天，[谁, 说的话, 几秒前]；谁 = 小王 / 老张 / 她
#   draft：她要发的那句
#   target：她在回谁（小王 / 老张，可省）；target_text：回的是哪句（可省，默认 target 最后一句）
#   expect：应该命中的规则检查名（qq_check_log.name）；只靠自检能认出的写 critic
#   ok：false 的例子（正常的话，不该命中任何检查），用来防误伤

- id: steal-answer
  date: 10-23 20:53
  what: 老张问小王能不能当自己的项目，她替小王答
  mode: 1
  msgs: [[小王, 我用一个 AI 工具做的, 120], [老张, 小王我学会了能当自己的项目吗, 10]]
  draft: 学会了也没空写，我赌五毛
  target: 老张
  expect: addressee

- id: media-claim
  date: 10-23 20:51
  what: 只有 [视频]，她说“前面那段可以砍一半”
  mode: 2
  msgs: [[小王, "[视频]", 40], [老张, 前面有点长, 20]]
  draft: 我同意，前面那段可以砍一半
  expect: media_claim

- id: media-promise
  date: 10-23 20:47
  what: 只有 [视频]，她说“成片来了，我看看”
  mode: 2
  msgs: [[小王, "[视频]", 20]]
  draft: 成片来了，我看看
  expect: media_claim

- id: video-pending
  date: 10-23 22:23
  what: B 站视频还在看，她空说“这就去看”
  mode: 2
  msgs: [[小王, "【我做了个 AI 群友】 https://b23.tv/x [链接：B站视频《我做了个 AI 群友》（UP主 小王，时长 1:43），你正在点开看]", 30]]
  draft: 成片终于发了，这就去看
  expect: video_pending

- id: image-assert
  date: 10-23 18:00
  what: 价目表说成“在看 8 号那场的场地”
  mode: 3
  msgs: [[老张, 周末打球不, 200], [小王, "[图片：照片，一家店的羽毛球價目表，關鍵字「羽毛球價目表」「RSL」，圖中日期「2025年8月」]", 15]]
  draft: 小王这是在看8号那场的场地啊
  image_top: 高
  expect: image_guess

- id: pushback
  date: 10-24 16:40
  what: 被说“你不识字吗”还顶“认字，广告太抢戏了”
  mode: 4
  msgs: [[小王, "[图片：截图，游戏广告，「玉芳荣耀」]", 120], [她, 玉芳荣耀这名字我先笑一下, 90], [老张, "[回复你的「玉芳荣耀这名字我先笑一下」] 你不识字吗", 20]]
  draft: 认字，广告太抢戏了
  target: 老张
  expect: pushback

- id: self-repeat
  date: 10-24 17:17
  what: 40 分钟内两次“眼睛不行”
  mode: 9
  msgs: [[她, 行，我眼睛被广告糊住了, 2400], [小王, 压力一个 ai？, 20]]
  draft: 压力倒不怕，就是眼睛不太行
  expect: self_repeat

- id: phrase-family
  date: 10-23 22:52
  what: “小本本 / 不记 / 当你没听见”一天第 6 次
  mode: 9
  msgs: [[她, 行吧，那我小本本记岔了, 30000], [小王, 已三连, 20]]
  draft: 三连到位，那我刚才那句就当你没听见
  expect: catchphrase

- id: stale-ask
  date: 10-23 13:32
  what: 大家在聊工资表，她追问早就发过的文档
  mode: 7
  msgs: [[小王, 开发文档我晚点发, 10800], [老张, 高校薪酬表, 60], [老张, 这个表挺全, 40], [小王, 博士后也有, 20]]
  draft: 工资这块我不懂，但那开发文档发了没
  expect: stale_ask

- id: made-up-number
  date: 10-24 13:24
  what: 说了资料里没有的时长（“24 分钟就没了”，其实 33 分钟）
  mode: 5
  msgs: [[小王, "@你 你觉得哪个队打的最烂", 10]]
  draft: AL吧，被KC一波推平，24分钟就没了
  expect: critic

# ---- 不该命中的（防误伤） ----
- id: ok-question-about-image
  expect: none
  msgs: [[小王, "[图片：照片，羽毛球价目表，RSL 每筒 120]", 15]]
  draft: 这是要囤球？
- id: ok-admit
  expect: none
  msgs: [[她, 9月底就结束了, 60], [小王, "[回复你的「9月底就结束了」] 不是写着到10月31日吗", 10]]
  draft: 啊我看错了，是10月31日
  target: 小王
- id: ok-not-remember
  expect: none
  msgs: [[她, 行吧，那我小本本记岔了, 3000], [小王, 你记得上周那家店叫啥吗, 10]]
  draft: 我不记得了，你问老张
  target: 小王

- id: phrase-family-watch
  date: 10-25 21:10
  what: 一天里第二次说“我去看”（说法族“我去看 / 看完了”一天最多一次）
  mode: 9
  msgs: [[她, 这就去看, 3000], [小王, 又出新的了, 60]]
  draft: 我去看看
  expect: catchphrase

- id: fish-bagu
  date: 10-19（B 站“鱼灾”）
  what: “看完了。最扎的是……不是……而是……”这种 AI 八股（规则层在质检里罚分，这里交给自检）
  mode: 11
  msgs: [[小王, 新视频发了, 60]]
  draft: 看完了。最扎的是结尾，不是剧情而是配乐
  expect: critic
